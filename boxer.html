<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex, nofollow">
<title>ムキムキ計画 BOXER PROTOCOL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0B0D'/><text x='18' y='76' font-size='64' fill='%23D9685A'>🥊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --card:#161519; --card2:#1E1C21; --line:#27242B;
  --txt:#F2EFE6; --muted:#8E897B; --accent:#EFCF7F; --accent2:#C49A3F;
  --p:#E3B85C; --f:#C9785A; --c:#7FA39B; --ok:#9BC47F; --bad:#D9685A; --sweet:#EFCF7F;
  --water:#6B97C2;
  --num:'Oswald','Avenir Next Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.92);backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);}
.hrow{display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:2.5px;white-space:nowrap;color:var(--accent);}
.logo .v{color:var(--muted);}
.datenav{display:flex;align-items:center;gap:5px;}
.datenav button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;
  padding:6px 9px;font-size:13px;}
.datenav .cur{font-weight:700;min-width:80px;text-align:center;font-size:12px;white-space:nowrap;color:var(--txt);}
main{padding:14px 14px 0;max-width:560px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;}
.card h3{margin:0 0 10px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:2px;}
.big{font-family:var(--num);font-size:32px;font-weight:600;}
.num{font-family:var(--num);font-weight:600;}
.muted{color:var(--muted);} .small{font-size:12px;} .xs{font-size:11px;}
.row{display:flex;align-items:center;gap:8px;} .between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
button.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#1A1407;
  font-weight:900;border-radius:12px;padding:13px 16px;font-size:14px;width:100%;}
button.btn:active{opacity:.85;}
button.btn.wk{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--num);letter-spacing:1px;}
button.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;}
button.mini{background:var(--card2);border:1px solid var(--line);color:var(--accent);
  border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:8px 10px;font-size:16px;}
input[type=number]{width:78px;text-align:center;}
.hero{display:flex;align-items:baseline;justify-content:center;gap:2px;}
.hero input{font-family:var(--num);font-size:78px;font-weight:600;background:none;border:none;
  color:var(--txt);text-align:center;width:188px;padding:0;line-height:1.05;}
.hero input::placeholder{color:#3A3730;}
.hero .kg{font-family:var(--num);font-size:24px;font-weight:600;color:var(--accent);}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.tile .tl{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.tile .tv{font-family:var(--num);font-size:26px;font-weight:600;}
.tile .tu{font-size:12px;color:var(--muted);font-weight:600;}
.tile .ts{font-size:10px;color:var(--accent);margin-top:4px;}
.tile input.tin{font-family:var(--num);font-size:26px;font-weight:600;background:none;border:none;
  width:80px;text-align:center;color:var(--txt);padding:0;}
.tile input.tin::placeholder{color:#3A3730;}
.stepbtn{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);font-size:16px;font-weight:700;flex:0 0 auto;}
.stepbtn.gold{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1A1407;border:none;}
.glink{color:var(--accent);font-size:12px;font-weight:700;text-decoration:none;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1A1407;border-color:transparent;font-weight:800;}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(16,15,18,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
nav button{flex:1;background:none;border:none;color:#56524A;font-size:10px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
nav button .ic{display:flex;}
nav button.on{color:var(--accent);}
.bar{height:10px;background:#26242B;border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.bar.blue>i{background:var(--water);} .bar.sweet>i{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.goalnum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.pill{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;}
.pill.ok{background:rgba(155,196,127,.13);color:var(--ok);} .pill.bad{background:rgba(217,104,90,.15);color:var(--bad);}
.pill.gold{background:rgba(239,207,127,.13);color:var(--accent);}
.pill.dim{background:var(--card2);color:var(--muted);border:1px solid var(--line);}
.nrow{display:flex;align-items:center;gap:8px;margin-top:9px;}
.nlabel{width:64px;font-size:12px;font-weight:700;flex:0 0 auto;}
.nbar{flex:1;height:8px;background:#26242B;border-radius:99px;overflow:hidden;}
.nbar>i{display:block;height:100%;border-radius:99px;transition:width .3s;}
.nval{width:80px;text-align:right;font-size:11px;color:var(--muted);font-weight:700;flex:0 0 auto;font-family:var(--num);}
.judge{font-size:10px;border-radius:99px;padding:3px 8px;font-weight:700;flex:0 0 auto;width:58px;text-align:center;}
.coach{display:flex;gap:10px;align-items:flex-start;}
.cavatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1A1407;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
.cbubble{background:var(--card2);border-radius:3px 14px 14px 14px;padding:10px 13px;font-size:13px;line-height:1.7;}
.mealgrp{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;}
.fooditem{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);}
.fooditem:last-child{border-bottom:none;}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--accent);font-size:16px;font-weight:700;}
.excard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
.exname{font-weight:700;font-size:15px;color:var(--accent);}
.setrow{display:flex;align-items:center;gap:4px;margin-top:7px;}
.setn{font-family:var(--num);font-size:10px;color:var(--muted);width:34px;flex:0 0 auto;letter-spacing:.5px;}
.sv{font-family:var(--num);font-size:17px;font-weight:600;width:52px;text-align:center;flex:0 0 auto;}
.sv i{font-style:normal;font-size:10px;color:var(--muted);margin-left:1px;}
/* 横スワイプで数値を変える。touch-action:pan-y なので縦スクロールは殺さない */
.drg{touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;
  border-bottom:1px dashed #4A4640;padding-bottom:1px;position:relative;}
.drg.dragging{color:var(--accent);border-bottom-color:var(--accent);}
.drg.dragging::after{content:'⇔';position:absolute;left:50%;transform:translateX(-50%);
  top:-15px;font-size:11px;color:var(--accent);}

.donebtn{width:30px;height:30px;border-radius:9px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:14px;font-weight:800;flex:0 0 auto;}
.donebtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1A1407;border:none;}
.delx{background:none;border:none;color:#56524A;font-size:15px;padding:2px 4px;}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center;}
#modal.show{display:flex;}
.sheet{background:#141317;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;
  overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.sheet h3{margin:2px 0 12px;font-size:16px;font-weight:700;}
.sheetclose{position:sticky;top:-16px;float:right;margin:-4px -4px 0 0;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;z-index:5;}
.foodrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);}
.foodrow .nm{font-size:14px;font-weight:600;}
.foodrow .meta{font-size:11px;color:var(--muted);font-family:var(--num);}
.addbtn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#1A1407;border-radius:10px;
  width:34px;height:34px;font-size:19px;font-weight:800;flex:0 0 auto;}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.95);background:#F2EFE6;color:#1A1407;
  padding:16px 26px;border-radius:16px;font-size:15px;font-weight:800;z-index:99;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;border:2px solid var(--accent2);
  box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:center;max-width:80vw;}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:40;display:none;
  justify-content:center;}
#rest.show{display:flex;}
.restbar{background:#161519;border:1.5px solid var(--accent2);border-radius:14px;padding:8px 10px;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.55);max-width:540px;width:calc(100% - 24px);}
.restbar .rt{font-family:var(--num);font-size:30px;font-weight:600;color:var(--accent);min-width:74px;text-align:center;letter-spacing:1px;}
.restbar.done .rt{color:var(--ok);}
.restbar .rex{font-size:11px;color:var(--muted);font-weight:700;flex:1;line-height:1.3;}
.restbar button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
  padding:8px 9px;font-size:12px;font-weight:700;flex:0 0 auto;}
.restbar button.skip{background:var(--accent2);color:#1A1407;border:none;}
.guide li{margin-bottom:6px;font-size:14px;line-height:1.6;}
.guide .tip{color:var(--accent);}
table.rep{width:100%;border-collapse:collapse;font-size:12px;}
table.rep td,table.rep th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;}
details{margin-top:8px;} summary{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photogrid .ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.photogrid img{width:100%;height:110px;object-fit:cover;display:block;}
.photogrid .pd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 5px;display:flex;justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">BOXER <span class="v">PROTOCOL</span></div>
    <div class="datenav">
      <button onclick="shiftDate(-1)">‹</button>
      <button class="cur" onclick="goToday()" id="dlabel"></button>
      <button onclick="shiftDate(1)">›</button>
    </div>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="rest"><div class="restbar" id="restbar"></div></div>

<script>
/* ================= データ ================= */
const LS='mukimuki_v1';
/* GitHub Pages で公開するため、個人の実測値はここに焼き込まない。
   初回起動時に「設定 → スタート地点」で入力するか、バックアップJSONを読み込む。 */
const DEF_PROFILE={height:170,startDate:'',startWeight:0,startBF:0,
  goalWeight:0,goalBF:0,goalWaist:0,goalDate:'',kcal:2250,p:150,f:70,c:255,
  water:3000,sleep:7,sweets:200,name:''};
/* BOXER仕様の目標値。
   ※初版は「74kg/体脂肪13%」としていたが、これは除脂肪64.4kgを要求する数字で、
     「除脂肪量は増やさない」という設計方針と矛盾していた（Codexレビューで発覚）。
     現在の除脂肪 約61kg を維持する前提で計算し直した値がこれ。
       74.0kg で体脂肪17.3% ／ 70.5kg でようやく13%
   index.html と localStorage を共有しているため既存プロフィールは自動上書きせず、
   ホームのワンタップ（applyBoxerGoal）で切り替える。 */
const BOXER_GOAL={goalWeight:74,goalBF:16,goalWaist:80,months:12};
/* P150g=600 + F70g=630 + C255g=1020 = 2250kcal（旧 F60/C270 は2220kcalで表示と不一致だった） */
const BOXER_MACRO={kcal:2250,p:150,f:70,c:255};
const BOXER_FINAL={weight:71,bf:13,waist:77};
/* 16週プログラム。4週ごとにデロード（Codex提案のピリオダイゼーション） */
const PROG_START='2026-08-24';
/* 縄跳びの段階導入表（Codex監査）。84kgで初日9分跳んで張りが出たので、
   火12-18分＋金9分は急すぎる。秒数で刻んで12週かけて3分ラウンドへ持っていく。
   [火の秒数, 火のセット数, 金の秒数, 金のセット数] / 金なしは0 */
const ROPE_RAMP={
 1:[30,6,0,0],  2:[45,6,0,0],  3:[60,6,30,4], 4:[45,6,0,0],
 5:[60,6,45,4], 6:[75,6,60,4], 7:[90,6,60,5], 8:[60,6,0,0],
 9:[90,5,60,4], 10:[120,4,90,4],11:[150,4,120,4],12:[90,4,60,4],
 13:[180,4,90,4],14:[180,4,120,4],15:[180,4,120,4],16:[90,4,0,0]};
/* 谷明けの再導入を緩やかに：週8(360秒)→週9は900秒ではなく720秒、
   週12(540秒)→週13も直前ピークを超えない。13-16週も定義して16週周期と揃える。
   4週・12週＝衝撃負荷だけを落とす週／8週・16週＝筋力も含む全身デロード。 */
const IMPACT_DELOAD=[4,12];
/* 縄跳びの処方は段階表が唯一の正。メニューの静的な「6セット×180秒」は使わない。
   その日の指定が0なら、種目自体をメニューから外す（残すと固定値で跳んでしまう）。 */
/* 監査#2「12か月仕様になっていない」への対応。
   続かない原因は根性ではなく、時間がない日・雨の日・病み上がりの日に
   「全部やるか、全部やらないか」の二択しかないこと。逃げ道を用意する。 */
const SHORT_KEEP={uA:['ベンチプレス','チェストサポートDBロウ','レッグプレス'],
                  uB:['ルーマニアンデッドリフト','懸垂','インクラインダンベルプレス']};
const RAIN_ALT={'縄跳び(3分ラウンド)':'インクラインウォーク','早歩き・軽いジョグ':'インクラインウォーク'};
function returnRamp(ds){
 const list=(S.pauses||[]).filter(function(pz){return pz.to;});
 if(!list.length)return null;
 const last=list[list.length-1];
 const days=Math.round((+new Date(last.to)-+new Date(last.from))/86400000);
 const since=Math.round((+new Date(ds)-+new Date(last.to))/86400000);
 if(days<7||since<0||since>7)return null;
 return {days:days,since:since};}
window.toggleShort=function(){S.shortDay=(S.shortDay===curDate)?null:curDate;saveR();
 toast(S.shortDay?'短縮版に切り替えました（主要3種目のみ）':'通常版に戻しました');};
window.toggleRain=function(){S.rainDay=(S.rainDay===curDate)?null:curDate;saveR();
 toast(S.rainDay?'雨天モード：屋外種目をジム内種目に置き換えます':'屋外に戻しました');};
function menuExFor(key,ds){
 let base=(MENUS[key]&&MENUS[key].ex)?MENUS[key].ex.slice():[];
 base=base.filter(function(ex){
  if(ex!=='縄跳び(3分ラウンド)')return true;
  return !!ropeFor(ds,new Date(ds+'T00:00:00').getDay()===5);});
 if(S.rainDay===ds)base=base.map(function(ex){return RAIN_ALT[ex]||ex;})
   .filter(function(ex,i,a){return a.indexOf(ex)===i;});
 if(S.shortDay===ds&&SHORT_KEEP[key])base=base.filter(function(ex){return SHORT_KEEP[key].indexOf(ex)>=0;});
 return base;}
function ropeFor(ds,isFriday){
 const w=Math.max(1,Math.min(16,progWeek(ds)||1));  /* 16週まで定義済み */
 const r=ROPE_RAMP[w]; if(!r)return null;
 const sec=isFriday?r[2]:r[0], n=isFriday?r[3]:r[1];
 if(!sec||!n)return null;
 return {sec:sec,sets:n,week:w,
  label:((sec>=120&&sec%60===0)?(sec/60)+'分':sec+'秒')+' × '+n+'ラウンド（レスト60秒）'};}
const PROG_WEEKS=16;
const DELOAD_WEEKS=[8,16];  /* 週2筋トレなので4週ごとは多すぎる（Codex監査） */
function progWeek(ds){const t0=+new Date(PROG_START+'T00:00:00'),t=+new Date(ds+'T00:00:00');
 if(t<t0)return 0;return Math.floor((t-t0)/(7*86400000))+1;}
function isDeload(ds){return DELOAD_WEEKS.indexOf(progWeek(ds))>=0;}
function phaseOf(w){
 if(w<=0)return {n:'開始前',d:'8/24からスタート'};
 if(w<=3)return {n:'第1期 校正',d:'開始重量を合わせる期間。RIR3で軽めに。縄跳びは30-45秒から'};
 if(w<=7)return {n:'第2期 蓄積',d:'RIR2-3で漸進。記録の完全性を90%以上に'};
 if(w===8)return {n:'デロード',d:'セット数40-50%減・重量10%減・RIR4。ここで回復を作る'};
 if(w<=15)return {n:'第3期 強度',d:'主種目4-6回。縄跳びは3分ラウンドへ'};
 if(w===16)return {n:'デロード＆再評価',d:'セット数半分。体重・ウエスト・筋力を測り直して次の16週を組む'};
 if(w<=18)return {n:'再校正',d:'16週の結果をClaudeに渡して次のブロックを組む。開始重量を測り直す期間'};
 const blk=Math.floor((w-1)/16)+1;
 return {n:'ブロック'+blk+'（通算'+w+'週）',d:'12ヶ月＝約52週。同じ16週サイクルを繰り返す。今は'+blk+'周目'};

function dayTotals(ds){const o=S.days[ds]||{};let k=0,p=0,f=0,c=0,sw=0;

 return {k:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c),sw:Math.round(sw)};}
function latestWeight(upto){const ds=Object.keys(S.days).filter(d=>d<=upto&&S.days[d].weight!=null).sort();
 return ds.length?{d:ds[ds.length-1],w:S.days[ds[ds.length-1]].weight}:null;}
function latestWaist(upto){const ds=Object.keys(S.days).filter(d=>d<=upto&&S.days[d].waist!=null).sort();

/* 除脂肪量。ボクサー設計では「ここを増やさず脂肪だけ削る」のが核心 */
function leanMass(upto){const lw=latestWeight(upto);if(!lw)return null;
 const ds=Object.keys(S.days).filter(d=>d<=upto&&S.days[d].bf!=null).sort();
 if(!ds.length)return null;const bf=S.days[ds[ds.length-1]].bf;

/* 休止期間（体調不良・出張・繁忙期）の合計日数。
   風邪で寝込んだ分まで「遅れ」として借金が積み上がると、復帰する気力がなくなる。
   休んだ日はラインの時間を進めない＝負債にしない、という設計。 */
function pausedDaysBefore(ds){const list=S.pauses||[];let n=0;const t=+new Date(ds+'T00:00:00');
 list.forEach(function(pz){const a=+new Date(pz.from+'T00:00:00');
  const b=pz.to?+new Date(pz.to+'T00:00:00'):t;
  if(b<=a)return; n+=Math.max(0,(Math.min(b,t)-a))/86400000;});
 return Math.round(n);}
function isPaused(ds){return (S.pauses||[]).some(function(pz){return pz.from<=ds&&!pz.to;});}
function goalLineAt(ds){const P=S.profile;const t0=+new Date(P.startDate),t1=+new Date(P.goalDate);
 let t=+new Date(ds);
 t-=pausedDaysBefore(ds)*86400000; /* 休止ぶんラインを後ろへずらす */
 if(t1<=t0)return P.goalWeight;const r=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
 return P.startWeight+(P.goalWeight-P.startWeight)*r;}

/* Codex監査の中心的な指摘：
   「1863kcal と記録されているのに体重が増えた」＝ 1日500-1000kcal の記録漏れ。
   0〜1000kcal の日は「少なく食べた日」ではなく【未完了ログ】として扱う。
   これを低摂取として平均に混ぜると、実態より節制しているように見えてしまう。 */
const INCOMPLETE_KCAL=1000;
/* 監査#2で、Codexが自分の前回提案を撤回した箇所。
   「1000kcal未満を自動で除外」は誤り。本当に少食だった日もあるし、
   逆に1100kcalまで入れて夕食を忘れた日はすり抜けてしまう。
   閾値ではなく【本人の明示的な完了操作】で判定する。
     full    … 本人が「記録完了」を押した日（カロリーの多寡を問わない）
     check   … 何か入っているが未確認。1000kcal未満なら特に要確認
     none    … 何も入っていない */
function logState(ds){const o=S.days[ds];if(!o)return 'none';
 const k=dayTotals(ds).k;
 if(o.logDone)return 'full';
 if(k<=0)return 'none';
 return 'check';}
function needsCheck(ds){const o=S.days[ds];if(!o||o.logDone)return false;
 return dayTotals(ds).k>0&&dayTotals(ds).k<INCOMPLETE_KCAL;}
/* 完全記録率：直近n日のうち、本人が「記録完了」を押した日の割合 */
function logRate(ds,n){
 const d=new Date(ds+'T00:00:00');let full=0,tot=0;
 for(let i=0;i<n;i++){const k=fmt(d);
  if(k>=S.profile.startDate&&k<=fmt(new Date())){tot++;if(logState(k)==='full')full++;}
  d.setDate(d.getDate()-1);}
 return tot?{full:full,tot:tot,pct:Math.round(full/tot*100)}:null;}

 o.logDone=o.logDone?0:1;

/* 直近4週の体重トレンド（kg/週）。点が少ないときは null を返して判定しない */
function trend4w(ds){
 const t1=+new Date(ds+'T00:00:00'),t0=t1-28*86400000;
 const pts=Object.keys(S.days).filter(function(d){return S.days[d].weight!=null;})
  .map(function(d){return [+new Date(d+'T00:00:00'),S.days[d].weight];})
  .filter(function(q){return q[0]>=t0&&q[0]<=t1;});
 if(pts.length<6)return null;
 const n=pts.length;let sx=0,sy=0,sxy=0,sxx=0;
 pts.forEach(function(q){const x=(q[0]-t0)/86400000,y=q[1];sx+=x;sy+=y;sxy+=x*y;sxx+=x*x;});
 const den=n*sxx-sx*sx; if(!den)return null;
 return ((n*sxy-sx*sy)/den)*7; /* 1日あたり→1週あたり */}

 return Math.max(0.1,(w-P.goalWeight)/(d/7));}

function weekFloorMet(anyDs){
 const d=new Date(anyDs+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)); /* 月曜へ */
 let w=0;const done={};

  if(o){if(o.weight!=null)w++;

    const mk=o.wk.menu||BYDAY[new Date(ds+'T00:00:00').getDay()];
    if(FLOOR.strengthDays.indexOf(mk)>=0)done[mk]=1;}}
  d.setDate(d.getDate()+1);}
 const t=Object.keys(done).length;
 return {w:w,t:t,ok:(w>=FLOOR.weighins&&t>=FLOOR.strengthDays.length),
  which:FLOOR.strengthDays.map(function(k){return {k:k,n:MENUS[k].name,done:!!done[k]};})};}
/* 最低ラインを満たした週が何週続いているか。日単位ではなく週単位で数える */
function streak(){let n=0;const d=new Date(curDate+'T00:00:00');
 d.setDate(d.getDate()-((d.getDay()+6)%7)); /* その週の月曜へ */
 for(let i=0;i<200;i++){const ds=fmt(d);
  const f=weekFloorMet(ds);
  if(f.ok)n++;

function lineChart(series,h){h=h||150;const w=340,pl=36,pr=10,pt=10,pb=20;
 let xs=[],ys=[];series.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
 if(!xs.length)return '<div class="muted small" style="padding:12px 0">まだデータがありません</div>';
 let x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 if(x1===x0)x1=x0+86400000;const ypad=(y1-y0)*0.12||1;y0-=ypad;y1+=ypad;
 const X=v=>pl+(v-x0)/(x1-x0)*(w-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(h-pt-pb);
 let g='';for(let i=0;i<=3;i++){const yy=pt+i*(h-pt-pb)/3;const yv=y1-(y1-y0)*i/3;
  g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(w-pr)+'" y2="'+yy+'" stroke="#26242B" stroke-width="1"/>'+
     '<text x="'+(pl-5)+'" y="'+(yy+4)+'" fill="#8E897B" font-size="10" text-anchor="end">'+yv.toFixed(1)+'</text>';}
 const paths=series.map(s=>{
  const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const dots=s.dots?s.pts.map(p=>'<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>').join(''):'';
  return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" '+(s.dash?'stroke-dasharray="5 5" opacity=".8"':'')+'/>'+dots;
 }).join('');
 const d0=new Date(x0),d1=new Date(x1);
 const lab='<text x="'+pl+'" y="'+(h-4)+'" fill="#8E897B" font-size="10">'+(d0.getMonth()+1)+'/'+d0.getDate()+'</text>'+
  '<text x="'+(w-pr)+'" y="'+(h-4)+'" fill="#8E897B" font-size="10" text-anchor="end">'+(d1.getMonth()+1)+'/'+d1.getDate()+'</text>';
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+g+paths+lab+'</svg>';}

 return v>=g;} /* hi も floor も「その値以上ならOK」 */

/* 目標体重×目標体脂肪率が要求する除脂肪量と、いまの除脂肪量を突き合わせる。
   初版はここが噛み合っておらず「除脂肪は増やさない」と言いながら+3.2kgを要求していた。 */
function goalSanity(lm){
 if(lm==null)return '';
 const P=S.profile;
 const need=Math.round(P.goalWeight*(1-P.goalBF/100)*10)/10;
 const gap=Math.round((need-lm)*10)/10;
 const bfIfHold=Math.round((1-lm/P.goalWeight)*1000)/10;
 const wIfHold=Math.round(lm/(1-P.goalBF/100)*10)/10;
 if(Math.abs(gap)<=0.7)
  return '<div class="xs" style="margin-top:8px;padding:8px;border:1px solid var(--ok);border-radius:9px;color:var(--ok);line-height:1.7">✓ 目標 '+P.goalWeight+'kg／'+P.goalBF+'% は、いまの除脂肪 '+lm+'kg を維持したまま到達できる数字です</div>';
 if(gap>0)
  return '<div class="xs" style="margin-top:8px;padding:8px;border:1px solid var(--bad);border-radius:9px;line-height:1.8"><b style="color:var(--bad)">⚠️ 目標の数字が噛み合っていません</b><br>'+
   P.goalWeight+'kg／'+P.goalBF+'% には除脂肪 '+need+'kg が必要で、いまより<b> +'+gap+'kg </b>増やす計算になります。<br>'+
   '<span class="muted">除脂肪 '+lm+'kg を維持するなら → '+P.goalWeight+'kgで体脂肪'+bfIfHold+'%、'+P.goalBF+'%になるのは'+wIfHold+'kg</span></div>';
 return '<div class="xs muted" style="margin-top:8px;line-height:1.7">この目標は除脂肪を '+Math.abs(gap)+'kg 減らす前提の数字です（筋肉も落とす計算）。狙ってやるのでなければ目標体重を見直しましょう。</div>';}

 const P=S.profile,lr=logRate(curDate,21),tr=trend4w(curDate);
 if(!lr||lr.pct<90)
  return {t:'hold',m:'まず記録から。直近3週の完全記録率が'+(lr?lr.pct:0)+'%です。<b>90%を3週続けるまで、摂取カロリーは動かしません。</b>記録が不完全なまま数字をいじっても、何が効いたか分からなくなります。'};
 if(tr==null)return {t:'hold',m:'記録は十分です。4週分の体重データが溜まったら判断します。'};
 if(tr>-0.15)
  return {t:'down',v:Math.max(1800,P.kcal-150),m:'完全記録率'+lr.pct+'%で、4週トレンドが'+tr.toFixed(2)+'kg/週。ほぼ横ばいです。<b>摂取を150kcal下げる</b>か、歩数を+2000にする。<u>両方同時にはやらない</u>。'};
 if(tr<-0.5)

 return {t:'ok',m:'完全記録率'+lr.pct+'%、4週トレンド'+tr.toFixed(2)+'kg/週。<b>ちょうどいいペースです。何も変えないでください。</b>'};}

function shrinkImage(file,maxPx){return new Promise(function(res,rej){
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=function(){
  let w=img.width,h=img.height;
  const sc=Math.min(1,maxPx/Math.max(w,h));
  w=Math.round(w*sc);h=Math.round(h*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(url);
  res(cv.toDataURL('image/jpeg',0.8).split(',')[1]);};
 img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('画像を読めませんでした'));};
 img.src=url;});}
window.photoMeal=function(ev){
 const file=ev.target.files&&ev.target.files[0];ev.target.value='';
 if(!file)return;
 if(!aiKey()){openModal('<h3>先にAPIキーの設定が必要です</h3>'+
   '<div class="small" style="line-height:1.9">写真からPFCを出すには、Anthropic APIのキーが要ります。<br>'+
   '① <b>console.anthropic.com</b> でアカウントを作る<br>'+
   '② API Keys から新しいキーを発行<br>'+
   '③ 下のボタンで貼り付ける<br><br>'+
   '<span class="muted">キーは<b>この端末のブラウザ内だけ</b>に保存されます。GitHubにも私にも送られません。'+
   '写真1枚あたり数円程度です。</span></div>'+
   '<button class="btn" style="width:100%;margin-top:12px" onclick="closeModal();setAiKey()">APIキーを入力する</button>');return;}
 openModal('<h3>📷 写真を解析中…</h3><div class="small muted" style="line-height:1.9">'+
  '皿の上のものを1品ずつ推定しています。<br>油・ドレッシング・調味料も見積もりに入れています（ここが抜けるのが過少記録の主因なので）。<br><br>10〜20秒ほどかかります。</div>');
 shrinkImage(file,1024).then(function(b64){
  return fetch('https://api.anthropic.com/v1/messages',{
   method:'POST',
   headers:{'content-type':'application/json','x-api-key':aiKey(),
    'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:AI_MODEL,max_tokens:1200,
    messages:[{role:'user',content:[
     {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
     {type:'text',text:AI_PROMPT}
    ]}]})});
 }).then(function(r){
  if(!r.ok)return r.text().then(function(t){throw new Error('API '+r.status+'：'+t.slice(0,200));});
  return r.json();
 }).then(function(j){
  const txt=(j.content||[]).map(function(c){return c.text||'';}).join('');
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('推定結果を読み取れませんでした：'+txt.slice(0,120));
  const d=JSON.parse(m[0]);
  aiPending=(d.items||[]).map(function(x){return {n:String(x.n||'不明').slice(0,20),
   k:Math.max(0,Math.round(+x.k||0)),p:Math.round((+x.p||0)*10)/10,
   f:Math.round((+x.f||0)*10)/10,c:Math.round((+x.c||0)*10)/10,sw:x.sw?1:0,q:1};});
  aiNote=d.note||'';
  if(!aiPending.length)throw new Error('食べ物を認識できませんでした');
  renderAiResult();

 let d;try{d=JSON.parse(m[0]);}catch(err){toast('JSONの形式が読めません');return;}

 return (s.w!==''&&s.w!=null&&s.w>0?s.w+'kg'+(exIsDb(ex)?'(片手)':''):'自重')+'×'+(s.r!==''&&s.r!=null?s.r:0);}
function prevLog(ex){const ds=Object.keys(S.days).filter(d=>d<curDate&&S.days[d].wk&&S.days[d].wk.logs&&(S.days[d].wk.logs[ex]||[]).some(s=>s.r||s.w||s.min)).sort();
 if(!ds.length)return null;const d=ds[ds.length-1];const sets=S.days[d].wk.logs[ex].filter(s=>s.r||s.w||s.min);
 const txt=sets.map(s=>fmtSet(s,ex)).join(', ');
 let top=null;sets.forEach(s=>{if(s.w!==''&&s.w!=null&&(top==null||s.w>top))top=s.w;});
 const rpe=S.days[d].wk.rpeMap?S.days[d].wk.rpeMap[ex]:null;
 return {d:d,txt:txt,top:top,last:sets[sets.length-1],sets:sets,rpe:rpe};}
/* 直近n回分のログ（新しい順）。2セッション連続クリアの判定に使う */
function prevLogN(ex,n){const ds=Object.keys(S.days).filter(function(d){return d<curDate&&S.days[d].wk&&S.days[d].wk.logs&&(S.days[d].wk.logs[ex]||[]).some(function(s){return s.r||s.w||s.min;});}).sort().reverse().slice(0,n);
 return ds.map(function(d){const sets=S.days[d].wk.logs[ex].filter(function(s){return s.r||s.w||s.min;});
  let top=null;sets.forEach(function(s){if(s.w!==''&&s.w!=null&&(top==null||s.w>top))top=s.w;});
  return {d:d,sets:sets,top:top,rpe:S.days[d].wk.rpeMap?S.days[d].wk.rpeMap[ex]:null};});}
const RPE_LABEL={easy:'余裕',ok:'丁度',hard:'限界'};
const RIR_LABEL={easy:'RIR3+',ok:'RIR2',hard:'RIR0-1'};
function exTarget(ex){
 if(exMode(ex)==='cardio')return null;
 if(S.injury&&EXDB[ex]&&EXDB[ex].spine)return null;
 const p=prevLog(ex);if(!p||!p.sets||!p.sets.length)return null;
 const g=EXDB[ex];if(!g||!g.sr)return null;
 const m=g.sr.match(/(\d+)セット×(\d+)(?:-(\d+))?/);
 if(!m){const tot=p.sets.reduce(function(a,s){return a+(parseFloat(s.r)||0);},0);
  return tot?{label:'前回合計'+tot+'回 → 今日は'+(tot+1)+'回'}:null;}
 const nSets=parseInt(m[1]),lo=parseInt(m[2]),hi=m[3]?parseInt(m[3]):lo;
 if(ex==='縄跳び(3分ラウンド)'){
  /* 段階導入表が処方を決めるので、前回比ではなく「今週の指定」を出す */
  const isFri=new Date(curDate+'T00:00:00').getDay()===5;
  const rp=ropeFor(curDate,isFri);
  if(!rp)return {label:'今週この曜日は縄跳びなし。速歩だけでいい（足への衝撃を溜めない週）'};
  return {label:'WEEK'+rp.week+'の指定 → '+rp.label+'　※増やさない'};}
 if(exMode(ex)==='bw'){
  const minR=Math.min.apply(null,p.sets.map(function(s){return parseFloat(s.r)||0;}));
  const everyHi=p.sets.length>=nSets&&p.sets.every(function(s){return (parseFloat(s.r)||0)>=hi;});
  /* prog:'sets' の種目（縄跳び・シャドー・HIIT）は1本の長さを伸ばさず「ラウンド数」で漸進する */
  if(g.prog==='sets'){
   const done=p.sets.filter(function(s){return (parseFloat(s.r)||0)>=hi;}).length;
   if(done>=nSets)return {label:'目標の'+nSets+'ラウンド達成済み。ここが上限 → 質を上げる（速度・ミスゼロ）'};
   if(p.sets.length>=done&&done>0&&done<nSets)
    return {label:'前回'+done+'ラウンド完遂 → 今日は'+(done+1)+'ラウンド（各'+hi+exUnit(ex)+'）'};
   return {label:'各'+hi+exUnit(ex)+'を完遂できるラウンドを1つ増やす'};}
  return everyHi?{label:'全セット'+hi+exUnit(ex)+'達成済み → '+(hi+ (exUnit(ex)==='秒'?15:2))+exUnit(ex)+'に挑戦'}
   :{label:'全セット'+Math.min(hi,minR+1)+exUnit(ex)+'以上を狙う'};}
 const top=p.top||0;
 if(!top){
  /* 自重（重量0）で記録している種目。懸垂がこれに当たる。
     重量欄が空なので従来は目標を出せなかったが、レップで漸進させ、
     上限を超えたら加重に切り替えるよう案内する。 */
  const minR0=Math.min.apply(null,p.sets.map(function(s2){return parseFloat(s2.r)||0;}));
  const allHi=p.sets.length>=nSets&&p.sets.every(function(s2){return (parseFloat(s2.r)||0)>=hi;});
  if(allHi)return {label:'自重で全セット'+hi+'回クリア → 次は加重 +5kg×'+lo+'回（ダンベルを足に挟めばOK）'};
  /* レップは足りているがセット数が足りない場合は、そこを指す */
  if(minR0>=hi&&p.sets.length<nSets)
   return {label:'前回'+p.sets.length+'セット×'+minR0+'回。あと'+(nSets-p.sets.length)+'セット増やして'+nSets+'セットにする（達成で加重スタート）'};
  return {label:'全セット'+Math.min(hi,minR0+1)+'回以上を狙う（'+hi+'回×'+nSets+'セットで加重スタート）'};}
 const everyHi=p.sets.length>=nSets&&p.sets.every(function(s){return (parseFloat(s.r)||0)>=hi;});
 if(isDeload(curDate))return {label:'デロード週：'+top+'kgのまま、セット数を半分・RIR4-5で。増量判定はしない'};
 if(everyHi&&p.rpe!=='hard'){
  /* Codexレビュー反映：1回クリアしただけでは上げない。
     同じ重量で「全セット上限×RIR2以上」を2セッション連続で達成してから増やす。
     減量期に毎回上げると、伸びではなくフォームの崩れで回数が出るようになるため。 */
  const hist=prevLogN(ex,2);const p2=hist[1];
  const p2Hi=p2&&p2.top===top&&p2.sets.length>=nSets&&
   p2.sets.every(function(s){return (parseFloat(s.r)||0)>=hi;})&&p2.rpe!=='hard';
  if(p2Hi){const nw=Math.round((top+wStep(ex))*10)/10;
   return {label:'重量UP！ '+nw+'kg×'+lo+'回〜（'+top+'kgで2回連続クリア）'};}
  return {label:top+'kgでもう1セッション（全セット'+hi+'回・RIR2以上をあと1回で重量UP）'+(p.rpe==='easy'?'・前回は余裕ありなので次で確実に上がる':'')};}
 const minR=Math.min.apply(null,p.sets.map(function(s){return parseFloat(s.r)||0;}));
 return {label:top+'kg×'+Math.min(hi,minR+1)+'回以上を全セット（'+hi+'回×'+nSets+'セットで次回重量UP）'+(p.rpe==='hard'?'・前回は限界。同重量で丁寧に':'')};}

/* ミッション編集。

window.editMission=function(){const cur=S.mission?S.mission.text:'';
 openModal('<h3>今週のミッション</h3>'+
  '<div class="xs muted" style="line-height:1.7;margin-bottom:8px">週次面談でClaudeが返した指示を、そのまま貼り付けてください。1週間ホームに表示されます。</div>'+
  '<textarea id="mtxt" style="width:100%;height:190px;font-size:15px;line-height:1.7;padding:10px" '+
   'placeholder="例）食事を7日間、全部記録する。食べる内容は変えなくていい。">'+esc(cur)+'</textarea>'+
  '<div class="row" style="gap:8px;margin-top:10px">'+
   '<button class="ghost" style="flex:1" onclick="missionPaste()">📋 貼り付け</button>'+
   '<button class="ghost" style="flex:1" onclick="missionClear()">✕ 全消し</button>'+
  '</div>'+
  '<button class="btn" style="width:100%;margin-top:8px" onclick="missionSave()">保存</button>'+
  (cur?'<button class="ghost" style="width:100%;margin-top:8px;color:var(--bad)" onclick="missionDelete()">ミッションを削除</button>':'')+
  '<div class="xs muted" style="margin-top:10px;line-height:1.7">「貼り付け」が効かない場合は、テキスト欄を長押し →「ペースト」でも入ります。</div>');
 setTimeout(function(){const e=document.getElementById('mtxt');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}},80);};
window.missionPaste=function(){
 const e=document.getElementById('mtxt');if(!e)return;
 if(!navigator.clipboard||!navigator.clipboard.readText){
  toast('この端末では自動貼り付けが使えません。長押し→ペーストで入れてください');e.focus();return;}
 navigator.clipboard.readText().then(function(t){
  if(!t){toast('クリップボードが空です');return;}
  e.value=t;e.focus();toast('貼り付けました');
 },function(){toast('貼り付けを許可できませんでした。長押し→ペーストで入れてください');e.focus();});};
window.missionClear=function(){const e=document.getElementById('mtxt');if(!e)return;
 e.value='';e.focus();};

 const t=e.value.trim();
 S.mission=t?{text:t,setAt:curDate}:null;
 save();closeModal();render();toast(t?'今週のミッションを設定しました':'ミッションを空にしました');};
window.missionDelete=function(){if(!confirm('今週のミッションを削除しますか？'))return;
 S.mission=null;save();closeModal();render();toast('ミッションを削除しました');};

window.exportJson=function(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='mukimuki_backup_'+curDate.replace(/-/g,'')+'.json';a.click();

window.shareJson=function(){
 const json=JSON.stringify(S,null,1);
 const file=new File([json],'mukimuki_backup_'+fmt(new Date()).replace(/-/g,'')+'.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){

  }).catch(function(){});
 }else{exportJson();render();}};
/* 自動スナップショット（IndexedDBに日次・14世代） */
function autoSnapshot(){if(!db||!db.objectStoreNames.contains('backups'))return;
 try{const st=db.transaction('backups','readwrite').objectStore('backups');
  st.put({d:fmt(new Date()),ts:Date.now(),data:localStorage.getItem(LS)});
  const kq=st.getAllKeys();
  kq.onsuccess=function(){const ks=kq.result.sort();while(ks.length>14){st.delete(ks.shift());}};
 }catch(e){}}
window.openBackups=function(){if(!db||!db.objectStoreNames.contains('backups')){toast('スナップショットがまだありません');return;}
 const q=db.transaction('backups','readonly').objectStore('backups').getAll();
 q.onsuccess=function(){const bs=q.result.sort(function(a,b){return a.d<b.d?1:-1;});
  if(!bs.length){toast('スナップショットがまだありません');return;}
  openModal('<h3>自動スナップショットから復元</h3>'+
   '<div class="xs muted" style="margin-bottom:8px">毎日の起動時に自動保存された14日分。復元すると現在のデータは上書きされます。</div>'+
   bs.map(function(b){const d=JSON.parse(b.data||'{}');const days=d.days?Object.keys(d.days).length:0;
    return '<div class="foodrow"><div><div class="nm">'+b.d+'</div><div class="meta">記録'+days+'日分</div></div>'+
     '<button class="mini" onclick="restoreBackup(\''+b.d+'\')">復元</button></div>';}).join(''));};};
window.restoreBackup=function(d){if(!confirm(d+' 時点のデータに戻します。現在のデータは上書きされます。よろしいですか？'))return;
 const q=db.transaction('backups','readonly').objectStore('backups').get(d);
 q.onsuccess=function(){if(q.result&&q.result.data){localStorage.setItem(LS,q.result.data);location.reload();}
  else toast('復元データが見つかりませんでした');};};
window.importJson=function(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=function(){try{const d=JSON.parse(r.result);if(!d.profile||!d.days)throw 0;S=d;save();render();toast('インポートしました ✓');}
 catch(e){toast('ファイルが読めませんでした');}};r.readAsText(f);};
window.resetAll=function(){if(!confirm('全データを削除します。エクスポート済みですか？'))return;
 if(!confirm('本当に初期化しますか？'))return;localStorage.removeItem(LS);location.reload();};

/* ================= 週次レビュー ================= */
window.weeklyReview=function(){
 const P=S.profile;const lines=[];
 for(let i=6;i>=0;i--){const d=new Date(curDate+'T00:00:00');d.setDate(d.getDate()-i);const ds=fmt(d);
  const o=S.days[ds]||{};const t=dayTotals(ds);
  let wk='休み';
  if(o.wk&&o.wk.logs&&Object.keys(o.wk.logs).length){
   const parts=Object.keys(o.wk.logs).map(ex=>{const sets=o.wk.logs[ex].filter(s=>s.r||s.w||s.min);
    if(!sets.length)return null;
    const rp=o.wk.rpeMap&&o.wk.rpeMap[ex]?'(手応え:'+RPE_LABEL[o.wk.rpeMap[ex]]+')':'';
    return ex+' '+sets.map(s=>fmtSet(s,ex)).join('/')+rp;}).filter(Boolean);
   if(parts.length)wk=(MENUS[o.wk.menu]?MENUS[o.wk.menu].name:'')+'：'+parts.join('、');
  }
  const cardio=(o.cardio||[]).map(c=>c.type+c.min+'分(約'+cardioKcal(c.type,c.min,ds)+'kcal)').join('、')||'なし';
  let meals='記録なし';
  if(o.meals&&o.meals.length){
   meals=MEAL_NAMES.map(function(mn){
    const its=o.meals.filter(function(m){return m.meal===mn;});
    if(!its.length)return null;
    return mn+'['+its.map(function(m){return m.n+(m.q&&m.q!==1?'×'+m.q:'');}).join('・')+']';
   }).filter(Boolean).join(' ');
  }
  lines.push(fmtShort(ds)+(o.event?'【会食日・枠'+o.event.kcal+'kcal】':'')+'｜体重'+(o.weight!=null?o.weight+'kg':'未計測')+(o.bf!=null?'/'+o.bf+'%':'')+(o.waist!=null?'/ウエスト'+o.waist+'cm':'')+
   '｜摂取'+t.k+'kcal P'+t.p+' F'+t.f+' C'+t.c+'（スイーツ'+t.sw+'kcal）'+
   '｜食事内容：'+meals+
   '｜水分'+((o.water||0)/1000).toFixed(1)+'L｜睡眠'+(o.sleep!=null?o.sleep+'h':'未記録')+
   '｜筋トレ：'+wk+'｜有酸素：'+cardio+
   (((o.wk&&o.wk.note)?'｜メモ：'+o.wk.note:'')));
 }
 const lw=latestWeight(curDate);const w=lw?lw.w:P.startWeight;const line=goalLineAt(curDate);
 const txt='あなたは私の専属パーソナルトレーナーです（ライザップ式：結果にコミット、厳しくも温かく）。\n'+
 '以下の1週間のデータを分析して、次の5点を簡潔に出してください。\n'+
 '1. 今週の評価（100点満点と一言）\n2. 良かった点\n3. 問題点とその原因分析\n'+
 '4. 来週の具体的な指示（食事・トレーニング・生活で各1つ以上、数値で）\n5. 停滞している場合の打ち手\n'+
 '※評価軸はボクサー体型です。体重より「ウエスト/身長比」と「除脂肪量が減っていないか」を優先して見てください。'+
 '※「未確認の日」は記録が完結していません。摂取量の平均に含めないでください。'+
 '※毎週見るのは「体重7日平均・ウエスト・完全記録率・筋トレ完遂率」の4つだけにしてください。'+
 '※摂取カロリーの変更提案は、完全記録率90%以上が3週続いてからにしてください。'+
 '筋肥大（サイズアップ）を勧める助言は不要です。上半身を厚くする方向の指示は避けてください。\n'+
 '※このメッセージに食事や体の写真が添付されていたら、数値に表れない食事の質（野菜・タンパク源・加工度・外食の内容）や体の変化も必ず評価に含めてください。\n\n'+
 '【プロフィール】'+(P.age?P.age+'歳':'')+'男性 '+P.height+'cm。開始時('+P.startDate+') '+P.startWeight+'kg/体脂肪'+P.startBF+'%。\n'+
 '【目標】'+P.goalDate+'までに'+P.goalWeight+'kg/体脂肪'+P.goalBF+'%/ウエスト'+P.goalWaist+'cm（ボクサー体型・ミドル級ゾーン）。週-0.3kgペース。\n'+
 '【設計方針】除脂肪量(約61kg)は増やさず脂肪だけ削る。4-8repを中心に部位あたり週6-8ハードセット・RIR2-3。'+
  'ボクシングジムには通わないため、技術練習ではなく「相対筋力＋走力＋低体脂肪」を作るプログラム。'+
  '筋トレはエニタイム、縄跳びとランは屋外。\n'+
 '【プログラム】'+(function(){const pw=progWeek(curDate);const ph=phaseOf(pw);
   return 'WEEK '+pw+'/'+PROG_WEEKS+'（'+ph.n+'：'+ph.d+'）'+(isDeload(curDate)?'※今週はデロード':'');})()+'\n'+
 '【日次目標】'+P.kcal+'kcal、P'+P.p+'g/F'+P.f+'g/C'+P.c+'g、水分'+(P.water/1000)+'L、睡眠'+P.sleep+'h以上。\n'+
 '【現在地】最新体重'+w+'kg（理想ライン'+line.toFixed(1)+'kg、差'+(w-line>=0?'+':'')+(w-line).toFixed(1)+'kg）'+
 (function(){const lm=leanMass(curDate);const c=classOf(w);const lwa=latestWaist(curDate);
   return (lm!=null?'　除脂肪'+lm+'kg':'')+(c?'　階級:'+c.n:'')+

 '【記録の完全性】'+(function(){const lr=logRate(curDate,7);

   return (lr?'完全記録率 '+lr.pct+'%（'+lr.full+'/'+lr.tot+'日が本人確認済み）':'')+

 '【BOXER KPI】'+KPIS.map(function(kp){const r=kpiVal(kp.k);

 '【今週の記録】\n'+lines.join('\n')+
 (function(){const ks=Object.keys(S.exNote||{});if(!ks.length)return '';
   return '\n\n【種目ごとの固定メモ（毎回の再現条件）】\n'+ks.map(function(k){return k+'：'+S.exNote[k];}).join('\n');})();
 copyText(txt);

(function(){const req=indexedDB.open('mukimuki',2);
